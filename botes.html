<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botes — Zenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10; --surface:#12151B; --surface-2:#171B22; --line:#212630;
    --cyan:#00D4FF; --cyan-dim:#00D4FF22; --gold:#FFD166; --text:#F2F5F8; --muted:#8A94A6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Manrope', sans-serif; min-height:100vh;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; letter-spacing:-0.02em;}
  a{color:inherit; text-decoration:none;}

  nav{display:flex; align-items:center; justify-content:space-between; padding:22px 6vw; border-bottom:1px solid var(--line);}
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px;}
  .lang-toggle{display:flex; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:100px; padding:4px;}
  .lang-toggle button{border:none; background:transparent; color:var(--muted); font-family:'Manrope', sans-serif; font-weight:700; font-size:12px; padding:6px 12px; border-radius:100px; cursor:pointer;}
  .lang-toggle button.active{background:var(--cyan); color:#04121A;}

  header{padding:6vw 6vw 2vw; max-width:1200px; margin:0 auto;}
  h1{font-size:clamp(28px,4vw,42px); font-weight:700;}
  .sub{color:var(--muted); margin-top:8px; font-size:15px; max-width:56ch;}

  .search-row{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}
  .search-input{
    flex:1; min-width:200px; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:13px 16px; border-radius:10px; font-size:14px; font-family:'Manrope';
  }
  .search-input:focus{outline:none; border-color:var(--cyan);}
  .filter-chip{
    padding:11px 16px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-family:'Manrope'; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .filter-chip.active{border-color:var(--cyan); background:var(--cyan-dim); color:var(--cyan);}

  main{max-width:1200px; margin:0 auto; padding:2vw 6vw 8vw;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; margin-top:24px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    overflow:hidden; transition:transform .2s ease, border-color .2s ease;
  }
  .card:hover{transform:translateY(-4px); border-color:#00D4FF55;}
  .card-photo{position:relative;}
  .card img{width:100%; height:190px; object-fit:cover; display:block; background:var(--surface-2);}
  .card .ph{width:100%; height:190px; display:flex; align-items:center; justify-content:center; background:var(--surface-2);}
  .card-badge{
    position:absolute; bottom:12px; right:12px; width:52px; height:52px;
    border-radius:50%; overflow:hidden; border:2px solid #fff; background:var(--surface);
  }
  .card-badge img{width:100%; height:100%; object-fit:cover;}
  .card-body{padding:18px 20px;}
  .card h3{font-size:17px; font-weight:700;}
  .card .empresa{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; margin-top:5px;}
  .card .meta{color:var(--muted); font-size:13px; margin-top:6px;}
  .card .price{color:var(--cyan); font-weight:700; font-size:15px; margin-top:12px;}
  .card .price span{color:var(--muted); font-weight:400; font-size:12px;}
  .card .cta{
    display:block; text-align:center; margin-top:14px; padding:11px; border-radius:10px;
    background:var(--cyan); color:#04121A; font-weight:700; font-size:14px;
  }

  .empty, .loading, .error{text-align:center; padding:80px 20px; color:var(--muted);}
  .spinner{width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--cyan); border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="/">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="1.6"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    ZENDA
  </a>
  <div class="lang-toggle">
    <button id="btn-es" onclick="setLang('es')">ES</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</nav>

<header>
  <h1 id="page-title">Botes disponibles</h1>
  <p class="sub" id="page-sub">Explora todos los botes publicados por nuestros proveedores en Miami.</p>

  <div class="search-row">
    <input class="search-input" id="search-input" type="text" placeholder="Buscar por nombre, marina o marca...">
  </div>
  <div class="search-row" id="filtros-marina"></div>
</header>

<main>
  <div id="loading" class="loading"><div class="spinner"></div><span id="loading-text">Cargando botes...</span></div>
  <div id="error" class="error" style="display:none;"><span id="error-text">No se pudieron cargar los botes.</span></div>
  <div id="empty" class="empty" style="display:none;"><span id="empty-text">Todavía no hay botes publicados.</span></div>
  <div id="grid" class="grid"></div>
</main>

<script>
  const SUPABASE_URL = 'https://bwbytdevgxywwzglyiri.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ePnGY7Nr8fXx02Zmhy-nuw_rMfJN1GO';

  const T = {
    es: {
      loading: 'Cargando botes...',
      error: 'No se pudieron cargar los botes.',
      empty: 'Todavía no hay botes publicados.',
      pageTitle: 'Botes disponibles',
      pageSub: 'Explora todos los botes publicados por nuestros proveedores en Miami.',
      searchPh: 'Buscar por nombre, marina o marca...',
      personas: 'personas',
      hora: '/hora',
      cta: 'Ver y Reservar',
      todas: 'Todas las marinas',
      sinResultados: 'No hay botes que coincidan con tu búsqueda.',
    },
    en: {
      loading: 'Loading boats...',
      error: 'Could not load the boats.',
      empty: 'No boats published yet.',
      pageTitle: 'Available boats',
      pageSub: 'Browse all boats published by our providers in Miami.',
      searchPh: 'Search by name, marina, or brand...',
      personas: 'people',
      hora: '/hour',
      cta: 'View & Book',
      todas: 'All marinas',
      sinResultados: 'No boats match your search.',
    }
  };

  let currentLang = localStorage.getItem('zenda_lang') || 'es';
  function t(key){ return T[currentLang][key]; }

  let TODOS_LOS_YATES = [];
  let MARINA_ACTIVA = null;
  let BUSQUEDA = '';

  function aplicarTraduccionesEstaticas(){
    document.getElementById('btn-es').classList.toggle('active', currentLang === 'es');
    document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
    document.documentElement.lang = currentLang;
    document.getElementById('page-title').textContent = t('pageTitle');
    document.getElementById('page-sub').textContent = t('pageSub');
    document.getElementById('search-input').placeholder = t('searchPh');
    document.getElementById('loading-text').textContent = t('loading');
    document.getElementById('error-text').textContent = t('error');
    document.getElementById('empty-text').textContent = t('empty');
  }

  function setLang(lang){
    currentLang = lang;
    localStorage.setItem('zenda_lang', lang);
    aplicarTraduccionesEstaticas();
    renderFiltrosMarina();
    renderGrid();
  }

  async function api(path){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    return res.json();
  }

  async function cachedApi(path, ttlSeconds){
    const cacheKey = 'zenda_cache_' + path;
    try{
      const cached = sessionStorage.getItem(cacheKey);
      if(cached){
        const parsed = JSON.parse(cached);
        if((Date.now() - parsed.ts) / 1000 < ttlSeconds) return parsed.data;
      }
    }catch(e){}
    const data = await api(path);
    try{ sessionStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data })); }catch(e){}
    return data;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  async function cargar(){
    aplicarTraduccionesEstaticas();
    try{
      // Sin filtro de company_slug: trae los yates de TODOS los proveedores.
      const yates = await cachedApi(`services?type=eq.yacht&activo=eq.true&select=*,companies(yacht_business_name,yacht_logo_url,company_slug)&order=created_at.desc`, 120);
      TODOS_LOS_YATES = yates || [];

      document.getElementById('loading').style.display = 'none';

      if(TODOS_LOS_YATES.length === 0){
        document.getElementById('empty').style.display = 'block';
        return;
      }

      renderFiltrosMarina();
      renderGrid();
    }catch(e){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }
  }
  cargar();

  function renderFiltrosMarina(){
    const marinas = Array.from(new Set(
      TODOS_LOS_YATES.map(y => y.atributos_json?.marina).filter(Boolean)
    )).sort();
    const cont = document.getElementById('filtros-marina');
    if(marinas.length === 0){ cont.innerHTML = ''; return; }
    cont.innerHTML = `<button class="filter-chip ${!MARINA_ACTIVA ? 'active' : ''}" onclick="elegirMarina(null)">${t('todas')}</button>` +
      marinas.map(m => `<button class="filter-chip ${MARINA_ACTIVA===m ? 'active' : ''}" onclick="elegirMarina('${escapeHtml(m).replace(/'/g,"\\'")}')">${escapeHtml(m)}</button>`).join('');
  }

  function elegirMarina(m){
    MARINA_ACTIVA = m;
    renderFiltrosMarina();
    renderGrid();
  }

  document.getElementById('search-input').addEventListener('input', function(e){
    BUSQUEDA = e.target.value.trim().toLowerCase();
    renderGrid();
  });

  function renderGrid(){
    let lista = TODOS_LOS_YATES;

    if(MARINA_ACTIVA){
      lista = lista.filter(y => y.atributos_json?.marina === MARINA_ACTIVA);
    }
    if(BUSQUEDA){
      lista = lista.filter(y => {
        const a = y.atributos_json || {};
        const nombreBote = (a.nombre_bote || y.nombre || '').toLowerCase();
        const marca = (a.marca_modelo || '').toLowerCase();
        const marina = (a.marina || '').toLowerCase();
        const empresa = (y.companies?.yacht_business_name || '').toLowerCase();
        return nombreBote.includes(BUSQUEDA) || marca.includes(BUSQUEDA) || marina.includes(BUSQUEDA) || empresa.includes(BUSQUEDA);
      });
    }

    const grid = document.getElementById('grid');
    if(lista.length === 0){
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">${t('sinResultados')}</div>`;
      return;
    }

    grid.innerHTML = lista.map(y => {
      const a = y.atributos_json || {};
      const nombreBote = a.nombre_bote || y.nombre;
      const marcaModelo = a.marca_modelo || '';
      const foto = (a.fotos && a.fotos[0]) || null;
      const boatSlug = y.slug || y.id;
      const empresa = y.companies?.yacht_business_name || '';
      const logo = y.companies?.yacht_logo_url || null;

      return `
        <a class="card" href="/bote/${encodeURIComponent(boatSlug)}">
          <div class="card-photo">
            ${foto
              ? `<img src="${escapeHtml(foto)}" alt="${escapeHtml(nombreBote)}">`
              : `<div class="ph"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8"><circle cx="12" cy="5" r="2"/><line x1="12" y1="7" x2="12" y2="21"/><path d="M5 12a7 7 0 0 0 7 9 7 7 0 0 0 7-9"/></svg></div>`
            }
            ${logo ? `<div class="card-badge"><img src="${escapeHtml(logo)}"></div>` : ''}
          </div>
          <div class="card-body">
            <h3>${escapeHtml(nombreBote)}</h3>
            ${empresa ? `<div class="empresa">${escapeHtml(empresa)}</div>` : ''}
            ${marcaModelo ? `<div class="meta">${escapeHtml(marcaModelo)}</div>` : ''}
            <div class="meta">${a.capacidad ? a.capacidad + ' ' + t('personas') : ''}${a.marina ? ' · ' + escapeHtml(a.marina) : ''}</div>
            <div class="price">$${y.precio_base}<span>${t('hora')}</span></div>
            <div class="cta">${t('cta')}</div>
          </div>
        </a>
      `;
    }).join('');
  }
</script>

</body>
</html>
